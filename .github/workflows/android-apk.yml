name: Build Android APK

# Дастӣ ба кор меафтад: GitHub -> Actions -> "Build Android APK" -> Run workflow.
# APK-ро аз Artifacts-и ҳамин иҷро зеркашӣ кунед.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and build web app
        run: |
          npm install
          npm run build

      - name: Add Capacitor (not saved to package.json)
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Capacitor config
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "org.miftahulhadis.app",
            "appName": "Miftahulhadis",
            "webDir": "dist",
            "server": { "url": "https://miftahulhadis.vercel.app", "cleartext": false }
          }
          JSON

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: miftahulhadis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
